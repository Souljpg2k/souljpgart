<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>souljpgart</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
</head>
<style>
    :root {
        --bg: rgba(21, 21, 21, 1);
        --fg: #f2f2f7;
        --box: rgba(21, 21, 21, 0.95);
        --surface: rgba(30, 30, 30, 1);
        --primary: #b7bdf8;
        --tst: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        /*--shadow: rgba(0, 0, 0, 0.8);*/
    }

    * {
        box-sizing: border-box;
        text-decoration: none;
    }

    html {
        scroll-behavior: smooth;
        overflow: hidden;
    }

    body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 500;
        background-color: var(--bg);
    }

    .frame

    /*,
        .shadow-frame */
        {
        position: fixed;
        top: 10px;
        left: 60px;
        right: 10px;
        bottom: 10px;
        border-radius: 18px;
        pointer-events: none;
        z-index: 50;
    }

    .frame {
        box-shadow: 0 0 0 100dvh var(--bg);
    }

    /*  .shadow-frame {
            box-shadow: inset 0 0 10px 0 var(--shadow);
            } */

    .bar {
        position: fixed;
        display: flex;
        justify-content: center;
        text-align: center;
        width: 60px;
        height: 100dvh;
        color: var(--fg);
        writing-mode: vertical-lr;
        user-select: none;
        z-index: 50;
    }

    .bar a {
        display: flex;
        margin-bottom: 0.5rem;
        color: var(--fg);
    }

    .inbar {
        position: relative;
        display: flex;
        justify-content: space-between;
        width: 100%;
        height: 100dvh;
        padding-top: 1rem;
        padding-bottom: 2rem;
    }

    .top,
    .center,
    .bottom {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .top h1 {
        margin-bottom: 1rem;
        writing-mode: initial;
        border-radius: 18px;
        padding: 0.2rem;
    }

    .top a {
        padding: 0.2rem;
        padding-bottom: 0.5rem;
        padding-top: 0.5rem;
        /*border-radius: 0 18px; */
        transition: var(--tst);
    }

    .top a:hover,
    .top a:focus-visible {
        color: var(--primary);
    }

    .bottom a:hover {
        transition: var(--tst);
        background-color: var(--primary);
        border-radius: 50%;
    }

    .links {
        display: flex;
        background-color: var(--surface);
        border-radius: 18px;
        margin-bottom: 0.5rem;
        padding: 0.2rem;
        padding-top: 0.3rem;
    }

    .bg {
        position: fixed;
        width: 100dvw;
        height: 100dvh;
        user-select: none;
        pointer-events: none;
        z-index: -2;
    }

    .bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: invert(80%);
        animation: zoom-out 2s cubic-bezier(0.9, 0, 0.2, 1) forwards;
    }

    @keyframes zoom-out {
        from {
            opacity: 0;
            transform: scale(1.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    #home {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100dvw;
        min-height: 100dvh;
        user-select: none;
    }

    .welcome {
        position: fixed;
        text-align: center;
        color: var(--fg);
        margin-top: 10rem;
        animation: opa 1.3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
    }

    .welcome h1,
    .welcome h3 {
        letter-spacing: -4px;
        font-size: 40px;
        margin: 0;
        background-color: var(--bg);
        z-index: 20;
    }

    .welcome h2 {
        position: absolute;
        top: -90%;
        text-shadow: 0 0 10px var(--bg);
        font-size: 25px;
        margin-left: 2rem;
        z-index: -1;
    }

    .welcome h3 {
        position: absolute;
        top: 90%;
        font-size: 40px;
        margin-left: 6rem;
        z-index: -1;
    }

    @keyframes opa {
        from {
            opacity: 0;
            transform: scale(0.9);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    #about {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100dvw;
        min-height: 100dvh;
        user-select: none;
    }

    #about h4 {
        opacity: 0.5;
        margin-bottom: 0.5rem;
    }

    .boxab {
        border-radius: 18px;
        padding: 1rem;
        background-color: var(--box);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        color: var(--fg);
        line-height: 1rem;
        transition: var(--tst);
    }

    .boxab:hover {
        transform: translateY(-10px);
    }

    .avatar {
        display: flex;
        width: 50px;
        height: 50px;
        border: 2px solid var(--primary);
        border-radius: 50%;
        pointer-events: none;
        gap: 1rem;
    }

    .avatar img {
        width: 100%;
        height: 100%;
        border-radius: 24px 24px 24px 0;
        object-fit: cover;
    }

    .brush {
        display: flex;
        align-items: center;
        gap: 1rem;
        line-height: 0.5rem;
    }

    .brush span {
        background-color: var(--primary);
        color: var(--bg);
        padding: 0.5rem;
        border-radius: 18px;
        transition: var(--tst);
    }

    .logo {
        position: fixed;
        top: 30px;
        left: 80px;
        padding: 0;
        color: var(--fg);
        background-color: var(--bg);
        user-select: none;
        animation: opa 1.3s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        z-index: 50;
    }

    .logo h1 {
        margin: 0;
        font-size: 40px;
        letter-spacing: -10px;
    }

    @media (max-width: 600px) {

        html,
        body {
            overflow: auto;
            scrollbar-width: none;
        }

        #home {
            padding-left: 1rem;
        }

        #about {
            padding-left: 3.2rem;
        }

        .logo {
            display: none;
        }
    }
</style>
